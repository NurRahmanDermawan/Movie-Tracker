name: movie-tracker

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "85:80"
    volumes:
      - uploads:/var/www/html/assets/uploads:ro
    depends_on:
      - app

  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: movie_tracker
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
    volumes:
      - uploads:/var/www/html/assets/uploads
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: movie_tracker
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
  uploads: